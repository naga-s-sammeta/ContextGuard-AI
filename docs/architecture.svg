<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="Segoe UI,Arial,sans-serif">
  <rect width="980" height="560" fill="#0d1117"/>
  <text x="490" y="38" fill="#e6edf3" font-size="24" font-weight="700" text-anchor="middle">ContextGuard — one semantic map, two jobs</text>
  <text x="490" y="62" fill="#8b949e" font-size="14" text-anchor="middle">Question in natural language → accurate, governed answer over PHI/PII/confidential data</text>

  <!-- Semantic map (center, shared) -->
  <rect x="360" y="240" width="260" height="92" rx="12" fill="#1f6feb22" stroke="#58a6ff" stroke-width="2"/>
  <text x="490" y="270" fill="#58a6ff" font-size="15" font-weight="700" text-anchor="middle">SEMANTIC MAP (single source)</text>
  <text x="490" y="292" fill="#c9d1d9" font-size="11.5" text-anchor="middle">certified tables · join keys · PHI/PII flags</text>
  <text x="490" y="308" fill="#c9d1d9" font-size="11.5" text-anchor="middle">approved metrics · freshness SLA · roles</text>
  <text x="490" y="324" fill="#8b949e" font-size="11" text-anchor="middle" font-style="italic">feeds BOTH jobs ↑↓</text>

  <!-- Job 1: accuracy (top row) -->
  <text x="120" y="110" fill="#2ea043" font-size="13" font-weight="700">JOB 1 — ACCURACY (anti-hallucination)</text>
  <rect x="40" y="125" width="150" height="64" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="115" y="152" fill="#e6edf3" font-size="13" text-anchor="middle">Question</text>
  <text x="115" y="172" fill="#8b949e" font-size="11" text-anchor="middle">(natural language)</text>

  <rect x="230" y="125" width="180" height="64" rx="10" fill="#161b22" stroke="#2ea043"/>
  <text x="320" y="150" fill="#e6edf3" font-size="13" text-anchor="middle">Schema-aware</text>
  <text x="320" y="168" fill="#e6edf3" font-size="13" text-anchor="middle">retrieval (narrow)</text>

  <rect x="450" y="125" width="170" height="64" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="535" y="150" fill="#e6edf3" font-size="13" text-anchor="middle">Generate SQL</text>
  <text x="535" y="168" fill="#8b949e" font-size="11" text-anchor="middle">det. / Featherless LLM</text>

  <!-- arrows top -->
  <line x1="190" y1="157" x2="228" y2="157" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="410" y1="157" x2="448" y2="157" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="535" y1="189" x2="535" y2="236" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="320" y1="189" x2="430" y2="240" stroke="#2ea043" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#a)"/>

  <!-- Job 2: governance (bottom row) -->
  <text x="120" y="420" fill="#f85149" font-size="13" font-weight="700">JOB 2 — GOVERNANCE (ContextGuard)</text>
  <rect x="360" y="380" width="260" height="120" rx="10" fill="#161b22" stroke="#f85149"/>
  <text x="490" y="404" fill="#e6edf3" font-size="13" font-weight="700" text-anchor="middle">6 gates</text>
  <text x="490" y="424" fill="#c9d1d9" font-size="11" text-anchor="middle">certified source · freshness · PHI/PII</text>
  <text x="490" y="440" fill="#c9d1d9" font-size="11" text-anchor="middle">SQL safety · approved metric · RLS</text>
  <text x="490" y="470" fill="#8b949e" font-size="11" text-anchor="middle">verdict + audit log + certified correction</text>
  <line x1="535" y1="332" x2="535" y2="378" stroke="#f85149" stroke-width="2" marker-end="url(#a)"/>

  <!-- outcomes -->
  <rect x="670" y="380" width="120" height="52" rx="10" fill="#2ea04322" stroke="#2ea043"/>
  <text x="730" y="411" fill="#a3e6b4" font-size="13" font-weight="700" text-anchor="middle">PASS</text>
  <rect x="670" y="446" width="120" height="52" rx="10" fill="#f8514922" stroke="#f85149"/>
  <text x="730" y="477" fill="#ffb4ad" font-size="12.5" font-weight="700" text-anchor="middle">BLOCKED / FLAGGED</text>
  <line x1="620" y1="420" x2="668" y2="406" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="620" y1="455" x2="668" y2="470" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>

  <!-- warehouse -->
  <rect x="800" y="240" width="150" height="92" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="875" y="270" fill="#e6edf3" font-size="12.5" font-weight="700" text-anchor="middle">Warehouse</text>
  <text x="875" y="290" fill="#8b949e" font-size="11" text-anchor="middle">Snowflake / BigQuery</text>
  <text x="875" y="306" fill="#8b949e" font-size="11" text-anchor="middle">DuckDB (demo)</text>
  <line x1="620" y1="286" x2="798" y2="286" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4"/>

  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
    <path d="M0,0 L7,3 L0,6 Z" fill="#8b949e"/></marker></defs>
</svg>
